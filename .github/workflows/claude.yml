# Async Claude on the Ember repo. You @mention claude in a GitHub issue or PR comment
# (from your phone, the GitHub app), it runs here on a cloud runner, does the work,
# and opens a PR. You review and merge in the evening. Your computer can be off: the
# job runs on GitHub's ubuntu-latest, not your machine.
#
# Auth uses your Claude Max plan, NOT a pay-per-use API key. One repo secret:
#   CLAUDE_CODE_OAUTH_TOKEN   minted locally with `claude setup-token` (Pro/Max only).
# The same token value from the Founder-Cockpit setup works here; just add it as a
# secret on this repo too (Settings > Secrets and variables > Actions).
#
# This repo is PUBLIC, so the job is locked to actor JulesLB: a stranger's comment
# can never trigger a run and burn your Max usage.
#
# Guardrail: the cloud runner has no DB or deploy secrets, so it physically can't
# touch prod. Keep async tasks to non-schema code. Don't ask it to run migrations
# (db:migrate hits prod) or deploy. Review every PR before merge; merge schema
# changes only when you're at your computer.
name: Claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >
      github.actor == 'JulesLB' && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
